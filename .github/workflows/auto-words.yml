name: Auto Generate German Vocabulary

on:
  schedule:
    # Запускається щодня о 09:00 за Києвом (07:00 UTC)
    - cron: '0 7 * * *'
  workflow_dispatch: # Дозволяє запускати вручну кнопкою у будь-який момент

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run vocabulary generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scripts/generate_words.js
